<!doctype html>
<html lang="{{locale.lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C0C0C" />
    <meta name="description" content="{{page.description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:description" content="{{page.description}}" />
    <meta property="og:url" content="{{page.canonical}}" />
    <title>{{page.title}}</title>
    <link rel="canonical" href="{{page.canonical}}" />
    <link rel="alternate" hreflang="zh-CN" href="{{route.zh}}" />
    <link rel="alternate" hreflang="en" href="{{route.en}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/geist-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
    <link rel="stylesheet" href="/download.css" />
  </head>
  <body>
{{partial.header}}
{{partial.content}}
    <footer class="site-footer container">
      <div class="footer-top">
        <a class="brand" href="{{route.home}}"
          ><img class="brand-mark" src="/logo-mark.svg" width="32" height="32" alt="" aria-hidden="true" />
          <span>WhyJ Quant</span></a
        ><span>Research. Backtest. Analyze.</span>
        <div>
          <a
            href="https://github.com/yangjingo/oh-my-quant"
            target="_blank"
            rel="noopener"
            class="icon-link" aria-label="{{nav.github}}" title="{{nav.github}}"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#github" /></svg></a
          ><a
            href="https://www.npmjs.com/package/whyj-quant"
            target="_blank"
            rel="noopener"
            class="icon-link" aria-label="{{footer.npm}}" title="{{footer.npm}}"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#package" /></svg></a
          >
        </div>
      </div>
      <div class="footer-bottom">
        <span>oh-my-quant · Built for thoughtful research.</span
        ><span>{{footer.notice}}</span>
      </div>
    </footer>
  </body>
</html>
