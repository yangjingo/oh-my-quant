<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="480" height="1222" viewBox="0 0 480 1222" role="img" aria-labelledby="title desc">
<title id="title">Report, sharing and execution boundaries</title><desc id="desc">Verification yields a private report and an allowlisted public share. Neither authorizes live orders.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker></defs>
<rect width="480" height="1222" fill="#0C0C0C"/>
<text x="24" y="48" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Reports, sharing, execution</text><text x="24" y="86" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Each artifact has its own evidence boundary</text><rect x="24" y="116" width="432" height="162" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="160" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Research inputs</text><text x="48" y="200" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Calls / inputs / outputs</text><text x="48" y="234" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">DatasetRef / pinned version</text><path d="M240 280V310" stroke="#8F8A7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="318" width="432" height="162" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="362" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Verification</text><text x="48" y="402" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Pair / archive / recompute</text><text x="48" y="436" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Retain gaps and caveats</text><path d="M240 482V514H10V786H18M240 514V524" stroke="#8F8A7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="532" width="432" height="162" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="576" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Full report · Private</text><text x="48" y="616" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Pinned HTML + provenance</text><text x="48" y="650" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Private sessions and traces</text><rect x="24" y="730" width="432" height="162" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="774" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Public share · Allowlist</text><text x="48" y="814" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Allowlist / anonymized NAV</text><text x="48" y="848" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">No cash / sessions / paths</text><text x="24" y="946" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Research done ≠ Order authorized</text><rect x="24" y="974" width="432" height="162" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="1018" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Execution contract</text><text x="48" y="1058" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Account / intent / checks / consent</text><text x="48" y="1092" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Separate idempotency / reconciliation</text><text x="24" y="1190" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Preserve observations; revise judgments.</text>
</svg>
