<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-labelledby="title desc">
<title id="title">Report, sharing and execution boundaries</title><desc id="desc">Research inputs are verified, then yield separate private reports and public shares. Execution requires its own authorization.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker></defs>
<rect width="1120" height="752" fill="#0C0C0C"/>
<text x="32" y="52" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="30" font-weight="600">Pin reports; separate sharing and execution</text><text x="32" y="91" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Reading, verification, sharing and execution each have a contract</text><rect x="32" y="208" width="300" height="166" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="56" y="252" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Research inputs</text><text x="56" y="292" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Calls / inputs / outputs</text><text x="56" y="326" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">DatasetRef / pinned version</text><rect x="402" y="208" width="300" height="166" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="426" y="252" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Verification</text><text x="426" y="292" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Pair / archive / recompute</text><text x="426" y="326" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Retain gaps and caveats</text><rect x="772" y="128" width="316" height="166" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="796" y="172" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Full report</text><text x="796" y="212" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Pinned HTML + provenance</text><text x="796" y="246" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Private sessions and traces</text><rect x="772" y="330" width="316" height="166" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="796" y="374" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Public share</text><text x="796" y="414" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Allowlist / anonymized NAV</text><text x="796" y="448" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">No cash / sessions / paths</text><path d="M334 290H394" stroke="#8F8A7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M704 260H736V210H764" stroke="#8F8A7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M704 330H736V412H764" stroke="#8F8A7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 376V474" stroke="#8F8A7B" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="32" y="482" width="670" height="160" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="56" y="526" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Execution contract</text><text x="56" y="566" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Account / intent / checks / consent</text><text x="56" y="600" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Separate idempotency / reconciliation</text><text x="772" y="554" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Research complete</text><text x="772" y="594" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">≠ Order authorized</text><path d="M32 680H1088" stroke="#3A362C"/><text x="32" y="719" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Preserve observations; revise judgments as new evidence arrives.</text>
</svg>
