<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1120" height="1072" viewBox="0 0 1120 1072" role="img" aria-labelledby="title desc"><title id="title">Repository enforcement boundaries</title><desc id="desc">Agents and maintainers apply guidance. Workflows run scripts to produce check status. The platform enforces configured merge rules.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#C99A2E"/></marker></defs><rect width="1120" height="1072" fill="#0C0C0C"/><text x="24" y="48" fill="#FFF3C4" font-size="32" font-weight="600" font-family="Arial,Helvetica,sans-serif">Who enforces each rule?</text><text x="24" y="86" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Guidance, checks and merge rules</text><path d="M24 110H1096" stroke="#3A362C"/><text x="24" y="144" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">01 / Guidance</text><g data-node="AGENTS.md"><rect x="24" y="170" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="44" y="207" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">AGENTS.md</text><text x="44" y="243" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Principles and entry points</text><text x="44" y="273" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Read by agents and maintainers</text></g><g data-node="Skills"><rect x="392" y="170" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="412" y="207" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Skills</text><text x="412" y="243" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Task steps and exceptions</text><text x="412" y="273" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Applied to the task</text></g><g data-node="Current Docs"><rect x="760" y="170" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="780" y="207" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Current Docs</text><text x="780" y="243" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Contracts and operations</text><text x="780" y="273" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Guide implementation / review</text></g><path d="M192 294V326H376V364" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><path d="M560 294V326H376V364" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><path d="M928 294V326H376V364" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><g data-node="Agent / Maintainer"><rect x="24" y="370" width="520" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="44" y="407" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Agent / Maintainer</text><text x="44" y="443" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Apply constraints, implement and review</text><text x="44" y="473" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Guidance does not block merges</text></g><path d="M544 430H744" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><text x="596" y="410" fill="#8F8A7B" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Produce</text><g data-node="Code / Docs / PR"><rect x="752" y="370" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="772" y="407" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Code / Docs / PR</text><text x="772" y="443" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Require independent checks</text><text x="772" y="473" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Retain scope and evidence</text></g><path d="M24 530H1096" stroke="#3A362C"/><text x="24" y="564" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">02 / Automated checks</text><g data-node="GitHub Workflow"><rect x="24" y="620" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="44" y="657" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">GitHub Workflow</text><text x="44" y="693" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Events / runtime / permissions</text><text x="44" y="723" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Schedule check jobs</text></g><g data-node="Scripts / Tests"><rect x="392" y="620" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="412" y="657" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Scripts / Tests</text><text x="412" y="693" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Run deterministic checks</text><text x="412" y="723" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Produce results and logs</text></g><g data-node="Check status"><rect x="760" y="620" width="336" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="780" y="657" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Check status</text><text x="780" y="693" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Record check outcomes</text><text x="780" y="723" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Bind to a commit and run</text></g><path d="M920 494V590H192V614" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><text x="622" y="580" fill="#8F8A7B" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Repository events</text><path d="M360 682H386" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M728 682H754" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M24 784H1096" stroke="#3A362C"/><text x="24" y="818" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">03 / Enforce configured merge rules</text><g data-node="Branch rules"><rect x="24" y="862" width="520" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="44" y="899" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Branch rules</text><text x="44" y="935" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Read required checks and configured conditions</text><text x="44" y="965" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Unconfigured rules are not enforced</text></g><path d="M920 744V824H284V856" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><text x="590" y="814" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Required check results</text><path d="M544 924H744" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><text x="596" y="904" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Pass</text><g data-node="Merge allowed"><rect x="752" y="862" width="336" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="772" y="899" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Merge allowed</text><text x="772" y="935" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Maintainer decides to merge</text><text x="772" y="965" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Passing checks is not a release</text></g><text x="24" y="1035" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Dashed: guidance   Solid: execution / output   Gold: merge rules</text></svg>
