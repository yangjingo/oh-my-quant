<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="480" height="1880" viewBox="0 0 480 1880" role="img" aria-labelledby="title desc"><title id="title">Repository enforcement boundaries</title><desc id="desc">Three guidance sources independently inform the executor. Automated checks produce status. Platform rules constrain merging.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#C99A2E"/></marker></defs><rect width="480" height="1880" fill="#0C0C0C"/><text x="24" y="48" fill="#FFF3C4" font-size="27" font-weight="600" font-family="Arial,Helvetica,sans-serif">Who enforces each rule?</text><text x="24" y="86" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Guidance, checks and merge rules</text><path d="M24 110H456" stroke="#3A362C"/><text x="24" y="144" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">01 / Guidance</text><g data-node="AGENTS.md"><rect x="40" y="164" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="201" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">AGENTS.md</text><text x="60" y="237" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Principles and entry points</text><text x="60" y="267" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Read by agents and maintainers</text></g><g data-node="Skills"><rect x="40" y="312" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="349" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Skills</text><text x="60" y="385" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Task steps and exceptions</text><text x="60" y="415" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Applied to the task</text></g><g data-node="Current Docs"><rect x="40" y="460" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="497" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Current Docs</text><text x="60" y="533" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Contracts and operations</text><text x="60" y="563" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Guide implementation / review</text></g><path d="M40 226H16V630H240V656" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><path d="M40 374H16V630" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><path d="M40 522H16V630" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><text x="40" y="614" fill="#8F8A7B" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Read / apply</text><g data-node="Agent / Maintainer"><rect x="40" y="662" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="699" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Agent / Maintainer</text><text x="60" y="735" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Implement and review code / docs / PRs</text><text x="60" y="765" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Guidance does not block merges</text></g><path d="M24 822H456" stroke="#3A362C"/><text x="24" y="856" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">02 / Automated checks</text><path d="M456 724H468V946H462" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><text x="272" y="870" fill="#8F8A7B" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Repo events</text><g data-node="GitHub Workflow"><rect x="40" y="884" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="921" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">GitHub Workflow</text><text x="60" y="957" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Events / runtime / permissions</text><text x="60" y="987" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Schedule check jobs</text></g><path d="M248 1008V1048" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><g data-node="Scripts / Tests"><rect x="40" y="1054" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="1091" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Scripts / Tests</text><text x="60" y="1127" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Run deterministic checks</text><text x="60" y="1157" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Produce results and logs</text></g><path d="M248 1178V1218" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><g data-node="Check status"><rect x="40" y="1224" width="416" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="1261" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Check status</text><text x="60" y="1297" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Record check outcomes</text><text x="60" y="1327" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Bind to a commit and run</text></g><path d="M24 1384H456" stroke="#3A362C"/><text x="24" y="1418" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">03 / Enforce configured rules</text><path d="M456 1286H468V1518H462" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><g data-node="Branch rules"><rect x="40" y="1456" width="416" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="60" y="1493" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Branch rules</text><text x="60" y="1529" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Required checks and configured rules</text><text x="60" y="1559" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Unconfigured rules are not enforced</text></g><path d="M248 1580V1630" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><text x="270" y="1612" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Pass</text><g data-node="Merge allowed"><rect x="40" y="1638" width="416" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="60" y="1675" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Merge allowed</text><text x="60" y="1711" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Maintainer decides to merge</text><text x="60" y="1741" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Passing checks is not a release</text></g><text x="24" y="1810" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Dashed: guidance   Solid: execution</text><text x="24" y="1846" fill="#C99A2E" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Gold: merge rules</text></svg>
