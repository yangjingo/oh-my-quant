<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>WhyJ Quant</title>
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="wordmark"><img class="mark" src="logo-mark.svg" width="24" height="24" alt="" aria-hidden="true"> WhyJ Quant</span>
    <span id="status" role="status">Starting…</span>
    <nav aria-label="Desktop controls">
      <button id="workspace">工作目录</button>
      <span class="divider"></span>
      <button id="font-smaller" title="缩小字号 · Ctrl+-" aria-label="缩小字号">A−</button>
      <button id="font-reset" title="重置字号 · Ctrl+0" aria-label="重置字号">14px</button>
      <button id="font-larger" title="放大字号 · Ctrl++" aria-label="放大字号">A+</button>
    </nav>
  </header>
  <main id="terminal" aria-label="WhyJ Quant research terminal"></main>
  <footer><span>输入 <b>/help</b> 查看命令 · <b>Ctrl+P</b> 设置模型与数据</span><span>中文输入 · Ctrl+V 粘贴 · Shift+拖选 / Ctrl+Shift+C 复制</span></footer>
  <section id="error" role="alert" hidden><h1>终端暂时不可用</h1><p id="error-message"></p><button id="retry">重新启动终端</button></section>
  <script src="renderer.js"></script>
</body>
</html>
