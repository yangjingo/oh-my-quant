<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="480" height="1850" viewBox="0 0 480 1850" role="img" aria-labelledby="title desc"><title id="title">The verification path to main</title><desc id="desc">CI, policy and Review are independent checks. Merge only after configured requirements pass; return failures to the feature branch.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#C99A2E"/></marker></defs><rect width="480" height="1850" fill="#0C0C0C"/><text x="24" y="48" fill="#FFF3C4" font-size="27" font-weight="600" font-family="Arial,Helvetica,sans-serif">From change to main</text><text x="24" y="86" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Verify the candidate; retry after changes</text><g data-node="Issue"><rect x="48" y="136" width="408" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="68" y="173" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Issue</text><text x="68" y="209" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Problem / scope / acceptance</text><text x="68" y="239" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Define the delivery scope</text></g><path d="M252 260V304" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><g data-node="Feature branch"><rect x="48" y="310" width="408" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="68" y="347" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Feature branch</text><text x="68" y="383" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Code / docs / tests</text><text x="68" y="413" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Revalidate after changes</text></g><path d="M252 434V478" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><g data-node="PR candidate"><rect x="48" y="484" width="408" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="68" y="521" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">PR candidate</text><text x="68" y="557" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Commit SHA + PR metadata</text><text x="68" y="587" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Verify the final revision</text></g><text x="48" y="652" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Checks</text><path d="M252 608V674H24V756H42" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M24 756V930H42" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M24 930V1104H42" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><g data-node="CI required"><rect x="48" y="694" width="384" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="68" y="731" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">CI required</text><text x="68" y="767" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Aggregate engineering checks</text><text x="68" y="797" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Fail / cancel / skip blocks</text></g><g data-node="PR policy"><rect x="48" y="868" width="384" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="68" y="905" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">PR policy</text><text x="68" y="941" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Check links and lifecycle</text><text x="68" y="971" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Body edits can trigger checks</text></g><g data-node="Review"><rect x="48" y="1042" width="384" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="68" y="1079" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Review</text><text x="68" y="1115" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Scope / correctness / fit</text><text x="68" y="1145" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Rules define approval needs</text></g><path d="M432 756H464V1220H252V1254" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><path d="M432 930H464V1220" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><path d="M432 1104H464V1220" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><g data-node="Pre-merge verification"><rect x="48" y="1262" width="408" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="68" y="1299" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Pre-merge verification</text><text x="68" y="1335" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Latest SHA + final metadata checks</text><text x="68" y="1365" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">All configured requirements satisfied</text></g><path d="M252 1386V1440" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><text x="276" y="1420" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Pass</text><g data-node="main"><rect x="48" y="1448" width="408" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="68" y="1485" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">main</text><text x="68" y="1521" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Merge and retain evidence</text><text x="68" y="1551" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Passing checks is not deployment</text></g><path d="M48 1324H8V372H42" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><path d="M24 1612H456" stroke="#3A362C"/><text x="24" y="1646" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Feedback and revision checks</text><text x="24" y="1680" fill="#FFF3C4" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Failure / change: return and recheck.</text><text x="24" y="1720" fill="#FFF3C4" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Strict: sync latest main and recheck.</text><text x="24" y="1760" fill="#FFF3C4" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Configure required check names.</text><text x="24" y="1810" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Dashed: feedback / review   Gold: gate</text></svg>
