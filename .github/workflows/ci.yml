name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rpc_413_probe:
        description: Compare packaged Host 413 connection reuse on Linux
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Release checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun install --cwd apps/web --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify Windows resource ACL fixture
        if: runner.os == 'Windows'
        run: bun test src/storage/test/resource-leases.test.ts
      - name: Test Desktop failure comparison
        run: node --test .github/scripts/desktop-failure-comparison.test.mjs
      - name: Run complete release gate
        run: |
          New-Item -ItemType Directory -Force output/ci | Out-Null
          bun run check:release 2>&1 | Tee-Object -FilePath output/ci/release.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare Desktop tests after a matching Windows failure
        if: ${{ failure() && runner.os == 'Windows' }}
        timeout-minutes: 3
        run: |
          $counts = @{}
          foreach ($name in @('node', 'bun', 'pwsh', 'powershell')) {
            $counts[$name] = @(Get-Process -Name $name -ErrorAction SilentlyContinue).Count
          }
          $env:WHYJ_CI_PROCESS_COUNTS = ConvertTo-Json -InputObject $counts -Compress
          node .github/scripts/desktop-failure-comparison.mjs output/ci/release.log output/ci/desktop-serial.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare packaged Host 413 connection reuse
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rpc_413_probe && runner.os == 'Linux' }}
        timeout-minutes: 10
        run: |
          $env:WHYJ_RPC_413_REUSE = 'false'
          bun run --preload ./apps/cli/dev/preload-rpc-413-comparison.ts ./apps/cli/dev/smoke-host.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:WHYJ_RPC_413_REUSE = 'true'
          bun run --preload ./apps/cli/dev/preload-rpc-413-comparison.ts ./apps/cli/dev/smoke-host.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the localized website
        if: runner.os == 'Linux'
        run: node site/scripts/build.mjs
      - name: Pack and smoke-test the npm installation
        run: |
          $packed = npm pack --ignore-scripts --json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tarball = Join-Path $PWD (($packed | ConvertFrom-Json)[0].filename)
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $smokeDir = Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          npm install --prefix $smokeDir --ignore-scripts --no-audit --no-fund $tarball
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location $smokeDir
          $output = node node_modules/whyj-quant/dist/index.js --json --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = $output | ConvertFrom-Json
          if (!$result.ok -or $result.data.version -ne $expected) {
            throw 'Installed CLI version does not match the package'
          }
      - name: Keep release gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-${{ github.run_attempt }}
          path: output/ci
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: CI required
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
