name: Optional live provider evaluation

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Explicitly authorize the bounded live provider requests
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    if: ${{ inputs.run_live && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Run bounded live evaluation
        env:
          WHYJ_LIVE_OPT_IN: 'true'
          WHYJ_LIVE_PROVIDER: ${{ vars.WHYJ_LIVE_PROVIDER }}
          WHYJ_LIVE_MODEL: ${{ vars.WHYJ_LIVE_MODEL }}
          WHYJ_LIVE_BASE_URL: ${{ vars.WHYJ_LIVE_BASE_URL }}
          WHYJ_LIVE_API_KEY: ${{ secrets.WHYJ_LIVE_API_KEY }}
        run: bun run src/runtime/dev/live-provider-eval.ts
      - name: Retain redacted outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-evaluation
          path: output/live-provider-eval/*.json
          if-no-files-found: warn
          retention-days: 14
