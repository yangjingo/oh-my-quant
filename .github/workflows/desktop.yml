name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer as a versioned GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ inputs.publish_release && 'publish' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    # PR/push already have CI. Manual packaging must validate the same full gate.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  windows:
    name: Desktop required
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location desktop
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check desktop
        run: |
          bun run --cwd desktop typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run --cwd desktop test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify online download failures and cancellation
        run: |
          bun run --cwd desktop test:online
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bundle runtimes and installer
        run: |
          ./desktop/scripts/prepare-runtime.ps1
          bun run desktop:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run --cwd desktop dist:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop/scripts/package-size.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run --cwd desktop dist:online
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install and exercise the shipped application
        run: |
          node desktop/scripts/test-online-install.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-online-evidence
          path: |
            output/desktop-online/*.json
            output/desktop-online/fixture/*.json
            output/desktop-online/ui/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: output/playwright/desktop
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-size-evidence
          path: output/desktop-size/package-size.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [checks, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate desktop release branch and version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const desktop = JSON.parse(readFileSync('desktop/package.json', 'utf8'));
          const cli = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF !== 'refs/heads/main' || desktop.version !== cli.version ||
              !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(desktop.version)) {
            throw new Error('Publish desktop releases from main with matching stable CLI/desktop versions');
          }
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          node .github/scripts/desktop-release-tag.mjs
          cp desktop/RELEASE-NOTES.md release/notes.md
          printf '\nVerification: [Windows build and installation acceptance](%s/%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/notes.md
          gh release create "v$version" release/*.exe release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "WhyJ Quant Desktop $version" --notes-file release/notes.md --latest
