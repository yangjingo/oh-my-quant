<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1120" height="996" viewBox="0 0 1120 996" role="img" aria-labelledby="title desc"><title id="title">The verification path to main</title><desc id="desc">An issue scopes the feature branch. The PR receives checks and review. Merge only when the final revision meets configured conditions. Failures or changes return to the branch.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#C99A2E"/></marker></defs><rect width="1120" height="996" fill="#0C0C0C"/><text x="24" y="48" fill="#FFF3C4" font-size="32" font-weight="600" font-family="Arial,Helvetica,sans-serif">From change to main</text><text x="24" y="86" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Verify the candidate; retry after changes</text><g data-node="Issue"><rect x="40" y="136" width="320" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="173" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Issue</text><text x="60" y="209" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Problem / scope / acceptance</text><text x="60" y="239" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Define the delivery scope</text></g><g data-node="Feature branch"><rect x="400" y="136" width="320" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="420" y="173" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Feature branch</text><text x="420" y="209" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Code / docs / tests</text><text x="420" y="239" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Revalidate after changes</text></g><g data-node="PR candidate"><rect x="760" y="136" width="320" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="780" y="173" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">PR candidate</text><text x="780" y="209" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Commit SHA + PR metadata</text><text x="780" y="239" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Verify the final revision</text></g><path d="M360 198H394" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M720 198H754" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M920 260V316H200V370" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M920 316H560V370" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><path d="M920 316V370" fill="none" stroke="#8F8A7B" stroke-width="2" marker-end="url(#normal)"/><text x="40" y="286" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Independent checks; Review is a separate judgment</text><g data-node="CI required"><rect x="40" y="378" width="320" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="60" y="415" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">CI required</text><text x="60" y="451" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Aggregate engineering checks</text><text x="60" y="481" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Fail / cancel / skip blocks</text></g><g data-node="PR policy"><rect x="400" y="378" width="320" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="420" y="415" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">PR policy</text><text x="420" y="451" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Check links and lifecycle</text><text x="420" y="481" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Body edits can trigger checks</text></g><g data-node="Review"><rect x="760" y="378" width="320" height="124" rx="6" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="780" y="415" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Review</text><text x="780" y="451" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Scope / correctness / fit</text><text x="780" y="481" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Rules define approval needs</text></g><path d="M200 502V554H560V612" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><path d="M560 502V612" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><path d="M920 502V554H560" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><g data-node="Pre-merge verification"><rect x="320" y="620" width="480" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="340" y="657" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">Pre-merge verification</text><text x="340" y="693" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Latest SHA + final metadata checks</text><text x="340" y="723" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">All configured requirements satisfied</text></g><path d="M800 682H844" fill="none" stroke="#C99A2E" stroke-width="2" marker-end="url(#gold)"/><g data-node="main"><rect x="852" y="620" width="228" height="124" rx="6" fill="#141312" stroke="#C99A2E" stroke-width="2"/><text x="872" y="657" fill="#FFF3C4" font-size="26" font-weight="600" font-family="Arial,Helvetica,sans-serif">main</text><text x="872" y="693" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Merge</text><text x="872" y="723" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Retain evidence</text></g><path d="M320 682H16V298H560V266" fill="none" stroke="#8F8A7B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#normal)"/><text x="40" y="598" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Failure / change</text><path d="M24 794H1096" stroke="#3A362C"/><text x="24" y="828" fill="#C99A2E" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif">Before merging</text><text x="24" y="868" fill="#FFF3C4" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif">Strict mode: sync with latest main and rerun checks.</text><text x="24" y="912" fill="#FFF3C4" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif">Configure required check names; a workflow alone does not enforce them.</text><text x="24" y="956" fill="#8F8A7B" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Dashed: feedback / review   Gold: merge gate   Deployment is not shown</text></svg>
