<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="480" height="1032" viewBox="0 0 480 1032" role="img" aria-labelledby="title desc">
<title id="title">Four checks and their unknowns</title><desc id="desc">Engineering tests, live-service samples, task traces and answer claims provide complementary evidence. Failures inform the next checks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8F8A7B"/></marker></defs>
<rect width="480" height="1032" fill="#0C0C0C"/>
<text x="32" y="52" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Every pass has a boundary</text><text x="32" y="91" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Four evidence types; no overall accuracy</text><rect x="24" y="126" width="432" height="178" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="164" font-family="Consolas,monospace" fill="#C99A2E" font-size="19" font-weight="400">01</text><text x="48" y="204" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Engineering regression</text><text x="48" y="242" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Protocols / cancellation / ledger / UI</text><text x="48" y="276" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Unknown: live services and models</text><rect x="24" y="328" width="432" height="178" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="366" font-family="Consolas,monospace" fill="#C99A2E" font-size="19" font-weight="400">02</text><text x="48" y="406" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Live-service samples</text><text x="48" y="444" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Selected endpoint / market / date</text><text x="48" y="478" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Unknown: other endpoints / longevity</text><rect x="24" y="530" width="432" height="178" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="568" font-family="Consolas,monospace" fill="#C99A2E" font-size="19" font-weight="400">03</text><text x="48" y="608" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Task traces</text><text x="48" y="646" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Tools / inputs / calls / recovery</text><text x="48" y="680" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Unknown: faithful final explanations</text><rect x="24" y="732" width="432" height="178" rx="10" fill="#141312" stroke="#3A362C" stroke-width="2"/><text x="48" y="770" font-family="Consolas,monospace" fill="#C99A2E" font-size="19" font-weight="400">04</text><text x="48" y="810" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="26" font-weight="600">Answer claims</text><text x="48" y="848" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Values / definitions / citations</text><text x="48" y="882" font-family="Arial,Helvetica,sans-serif" fill="#8F8A7B" font-size="21" font-weight="400">Unknown: unseen claims and errors</text><path d="M32 920H448" stroke="#3A362C"/><text x="32" y="954" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Keep failures → Classify → Add checks</text><text x="32" y="994" font-family="Arial,Helvetica,sans-serif" fill="#FFF3C4" font-size="22" font-weight="400">Retest independently → Note unknowns</text>
</svg>
