<rect x="44" y="166" width="308" height="298" rx="12" class="box blue"/><text x="66" y="203" class="label" >Pi 协议与循环</text><text x="66" y="235" class="body" >模型协议与目录</text><text x="66" y="262" class="body" >底层工具循环</text><text x="66" y="289" class="body" >WhyJ kernel 负责接入适配</text><text x="66" y="316" class="body" ></text><text x="66" y="343" class="body" >变化：供应商协议</text><rect x="406" y="166" width="308" height="298" rx="12" class="box teal"/><text x="428" y="203" class="label" >WhyJ session-runtime</text><text x="428" y="235" class="body" >准备 → 执行 → 落盘</text><text x="428" y="262" class="body" >队列、取消、分支、压缩</text><text x="428" y="289" class="body" >连接与资源快照</text><text x="428" y="316" class="body" ></text><text x="428" y="343" class="body" >变化：产品生命周期</text><rect x="768" y="166" width="308" height="298" rx="12" class="box neutral"/><text x="790" y="203" class="label" >研究与应用</text><text x="790" y="235" class="body" >Source / Quant / Storage</text><text x="790" y="262" class="body" >ResearchState 与证据核验</text><text x="790" y="289" class="body" >TUI / Artifact 结果投影</text><text x="790" y="316" class="body" ></text><text x="790" y="343" class="body" >变化：研究契约</text><path d="M406 284 H356" class="arrow" marker-end="url(#arrow)"/><path d="M714 284 H764" class="arrow" marker-end="url(#arrow)"/><text x="44" y="514" class="label" >核心约束：恢复先准备后提交；旧操作不能把结果写入新研究。</text>
