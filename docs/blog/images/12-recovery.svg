<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">失败之后，仍然看得见下一步</title><desc id="desc">可达的细节、固定的操作和有边界的草稿，让恢复成为正常工作的一部分。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#697586"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#182333}.title{font-size:30px;font-weight:700}.eyebrow{font-size:14px;letter-spacing:2px;fill:#49687d}.label{font-size:21px;font-weight:600}.body{font-size:17px;fill:#405164}.note{font-size:16px;fill:#657083}.box{stroke-width:1.5}.neutral{fill:#f4f6f8;stroke:#cbd3dc}.blue{fill:#edf4fd;stroke:#8aadd5}.teal{fill:#edf7f4;stroke:#84b7a5}.amber{fill:#fff6e7;stroke:#d2ad69}.arrow{fill:none;stroke:#697586;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}</style><rect width="1120" height="630" fill="#fff"/>
<text x="44" y="34" class="eyebrow">WHYJ-QUANT / AGENT ENGINEERING / 12</text><text x="44" y="84" class="title">失败之后，仍然看得见下一步</text><text x="44" y="119" class="note">可达的细节、固定的操作和有边界的草稿，让恢复成为正常工作的一部分。</text>
<rect x="44" y="167" width="475" height="379" rx="10" class="box neutral"/><text x="64" y="207" class="label">Doctor：看清范围，再读细节</text><rect x="64" y="228" width="435" height="55" rx="10" class="box blue"/><text x="81" y="262" class="body">固定摘要：各阶段状态 / 未测试</text><rect x="64" y="297" width="435" height="144" rx="10" class="box teal"/><text x="81" y="333" class="label">可滚动正文</text><text x="81" y="372" class="body">阶段详情 / 警告 / 修复建议</text><text x="81" y="408" class="note">方向键 · 翻页 · Home / End</text><rect x="64" y="455" width="435" height="65" rx="10" class="box amber"/><text x="81" y="495" class="body">固定操作：重试 / 配置 / 关闭</text><rect x="575" y="167" width="501" height="92" rx="10" class="box blue"/><text x="595" y="204" class="label">编辑数据草稿</text><text x="595" y="239" class="body">输入保留；修改使旧验证失效</text><path d="M826 263V290" class="arrow"/><rect x="575" y="298" width="501" height="91" rx="10" class="box teal"/><text x="595" y="335" class="label">Check 当前样本</text><text x="595" y="369" class="body">失败可修改；取消隔离迟到结果</text><path d="M826 393V420" class="arrow"/><rect x="575" y="428" width="501" height="118" rx="10" class="box amber"/><text x="595" y="466" class="label">Save verified</text><text x="595" y="502" class="body">只保存与成功检查匹配的草稿</text><text x="595" y="530" class="note">关闭未保存草稿，不等于撤销已保存设置</text>
