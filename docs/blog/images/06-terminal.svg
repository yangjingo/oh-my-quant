<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#182333}.title{font-size:30px;font-weight:700}.eyebrow{font-size:14px;letter-spacing:2px;fill:#49687d}.label{font-size:21px;font-weight:600}.body{font-size:17px;fill:#405164}.note{font-size:16px;fill:#657083}.box{stroke-width:1.5}.neutral{fill:#f4f6f8;stroke:#cbd3dc}.blue{fill:#edf4fd;stroke:#8aadd5}.teal{fill:#edf7f4;stroke:#84b7a5}.amber{fill:#fff6e7;stroke:#d2ad69}.red{fill:#fff0ef;stroke:#d99b98}.arrow{fill:none;stroke:#697586;stroke-width:2}.dashed{stroke-dasharray:7 6}</style>
