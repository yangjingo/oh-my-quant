<text x="44" y="207" class="label" >旧轮次 g₁</text><path d="M214 198 H846" class="arrow" marker-end="url(#arrow)"/><rect x="265" y="162" width="215" height="78" rx="12" class="box neutral"/><text x="287" y="199" class="label" >发起旧请求</text><rect x="598" y="162" width="215" height="78" rx="12" class="box red"/><text x="620" y="199" class="label" >旧结果晚到</text><text x="864" y="205" class="label" >× 不发布</text><text x="44" y="353" class="label" >新轮次 g₂</text><path d="M214 344 H1069" class="arrow" marker-end="url(#arrow)"/><rect x="265" y="308" width="215" height="78" rx="12" class="box blue"/><text x="287" y="345" class="label" >新输入 / 取消旧轮</text><rect x="598" y="308" width="215" height="78" rx="12" class="box teal"/><text x="620" y="345" class="label" >首批可用行</text><rect x="863" y="308" width="213" height="78" rx="12" class="box teal"/><text x="885" y="345" class="label" >渐进补齐</text><path d="M373 242 V304" class="arrow dashed" marker-end="url(#arrow)"/><text x="496" y="280" class="note" >有效代次检查</text><rect x="265" y="440" width="811" height="88" rx="12" class="box neutral"/><text x="287" y="477" class="label" >Screen 背压：只保留最新待发帧</text><text x="287" y="509" class="body" >drain 后同步重画；不是删除会话中的工具与结果事件</text>
