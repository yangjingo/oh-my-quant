<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">从一次对话，走向可以继续的研究</title><desc id="desc">准备、研究、留存和继续属于同一工作流，却不必挤在同一个聊天入口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#697586"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#182333}.title{font-size:30px;font-weight:700}.eyebrow{font-size:14px;letter-spacing:2px;fill:#49687d}.label{font-size:21px;font-weight:600}.body{font-size:17px;fill:#405164}.note{font-size:16px;fill:#657083}.box{stroke-width:1.5}.neutral{fill:#f4f6f8;stroke:#cbd3dc}.blue{fill:#edf4fd;stroke:#8aadd5}.teal{fill:#edf7f4;stroke:#84b7a5}.amber{fill:#fff6e7;stroke:#d2ad69}.arrow{fill:none;stroke:#697586;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}</style><rect width="1120" height="630" fill="#fff"/>
<text x="44" y="34" class="eyebrow">WHYJ-QUANT / AGENT ENGINEERING / 08</text><text x="44" y="84" class="title">从一次对话，走向可以继续的研究</text><text x="44" y="119" class="note">准备、研究、留存和继续属于同一工作流，却不必挤在同一个聊天入口。</text>
<rect x="44" y="173" width="216" height="142" rx="10" class="box blue"/><text x="64" y="208" class="label">准备</text><text x="64" y="248" class="body">模型 / 数据 / 观察组</text><text x="64" y="282" class="note">本地控制</text><path d="M262 241H308" class="arrow"/><rect x="316" y="173" width="216" height="142" rx="10" class="box teal"/><text x="336" y="208" class="label">研究</text><text x="336" y="248" class="body">意图 / 参数 / 工具</text><text x="336" y="282" class="note">自然语言探索</text><path d="M534 241H580" class="arrow"/><rect x="588" y="173" width="216" height="142" rx="10" class="box amber"/><text x="608" y="208" class="label">留存</text><text x="608" y="248" class="body">固定报告 / 来源分支</text><text x="608" y="282" class="note">有依据的结果</text><path d="M806 241H852" class="arrow"/><rect x="860" y="173" width="216" height="142" rx="10" class="box blue"/><text x="880" y="208" class="label">继续</text><text x="880" y="248" class="body">核对来源 / 恢复分支</text><text x="880" y="282" class="note">不是重新取数替换</text><path d="M968 320V366H424V320" class="arrow"/><text x="480" y="355" class="note">围绕同一研究继续，而不是从消息重新猜参数</text><rect x="44" y="410" width="1032" height="124" rx="10" class="box neutral"/><text x="66" y="450" class="label">产品边界先于功能数量</text><text x="66" y="486" class="body">观察组合 ≠ 真实账户　　研究完成 ≠ 交易授权</text><text x="66" y="517" class="note">闭环回归验证工作可延续；用户学习成本与任务效率需要另外测量。</text>
<path d="M44 582H1076" stroke="#dde3e8"/><text x="44" y="610" class="note">机制与布局示意 · 依据 2026-10-13 工作区 · 非真实终端截图或用户效果测量</text>
</svg>
