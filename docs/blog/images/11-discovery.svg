<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">找到动作、读懂用法、明确执行</title><desc id="desc">功能发现是一条路径，不是一张塞满命令的清单。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#697586"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#182333}.title{font-size:30px;font-weight:700}.eyebrow{font-size:14px;letter-spacing:2px;fill:#49687d}.label{font-size:21px;font-weight:600}.body{font-size:17px;fill:#405164}.note{font-size:16px;fill:#657083}.box{stroke-width:1.5}.neutral{fill:#f4f6f8;stroke:#cbd3dc}.blue{fill:#edf4fd;stroke:#8aadd5}.teal{fill:#edf7f4;stroke:#84b7a5}.amber{fill:#fff6e7;stroke:#d2ad69}.arrow{fill:none;stroke:#697586;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}</style><rect width="1120" height="630" fill="#fff"/>
<text x="44" y="34" class="eyebrow">WHYJ-QUANT / AGENT ENGINEERING / 11</text><text x="44" y="84" class="title">找到动作、读懂用法、明确执行</text><text x="44" y="119" class="note">功能发现是一条路径，不是一张塞满命令的清单。</text>
<rect x="44" y="167" width="270" height="107" rx="10" class="box blue"/><text x="64" y="208" class="label">共享 name / desc</text><text x="64" y="246" class="body">command-catalog</text><path d="M318 220H366" class="arrow"/><rect x="374" y="167" width="702" height="107" rx="10" class="box teal"/><text x="394" y="208" class="label">Composer 补全 / Help 浏览 / CLI 帮助</text><text x="394" y="246" class="body">先找到动作，再查询完整用法；不为每个工具新增顶层命令</text><rect x="44" y="318" width="490" height="157" rx="10" class="box amber"/><text x="64" y="357" class="label">查询用法</text><text x="64" y="392" class="body">/help COMMAND · /COMMAND --help</text><text x="64" y="429" class="body">先返回说明，不执行目标命令</text><text x="64" y="458" class="note">损坏配置下仍可查询</text><rect x="568" y="318" width="508" height="157" rx="10" class="box blue"/><text x="588" y="357" class="label">明确执行</text><text x="588" y="392" class="body">有效命令 → 预检 → 本地动作</text><text x="588" y="429" class="body">Commands：Enter run · ? usage</text><text x="588" y="458" class="note">Hotkeys：只读参考，不模拟执行</text><path d="M610 280V296H290V312" class="arrow"/><path d="M820 280V312" class="arrow"/><rect x="44" y="502" width="1032" height="52" rx="10" class="box neutral"/><text x="64" y="536" class="body">自然语言 → Agent 研究：保留开放表达，不要求用户记住全部分析工具</text>
<path d="M44 582H1076" stroke="#dde3e8"/><text x="44" y="610" class="note">机制与布局示意 · 依据 2026-10-13 工作区 · 非真实终端截图或用户效果测量</text>
</svg>
